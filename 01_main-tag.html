<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>메인 태그</title>
  </head>
  <body>
    <!-- 제목, 헤드라인, h1 ~ h6 -->
    <h1>헤드라인 1</h1>
    <!-- h1 가장 큰것 -->
    <h2>헤드라인 2</h2>
    <h3>헤드라인 3</h3>
    <!-- 여기까지만... 왜? 마크다운 -> h3까지만 대응해서 지원 -->
    <!-- #, ##, ### -->
    <h4>헤드라인 4</h4>
    <h5>헤드라인 5</h5>
    <h6>헤드라인 6</h6>
    <!-- 시각적 차이 뿐만 아니라 검색 엔진, AI는 이 h들을 우선적으로 검색 -->
    이렇게 직접 씁니까? <br />
    <!-- 줄바꿈 br -->
    <!-- 텍스트가 들어가도 '문단'을 구분하는 태그 안에 있는게 아니면 붙여서 표현 -->
    엔터가 안 먹어요
    <!-- parsing -> 그 역할만 하게 하고 화면에 표시 하지 X -->
    <p>문단을 의미</p>
    <!-- shift enter : 문단 내 줄바꿈 -->
    바로 붙여서 <br />
    표현
    <p>확실히 구분 되기 위해 위 아래 여백으로 구분</p>
    <p>확실히 구분 되기 위해 위 아래 여백으로 구분</p>
    <p>p 태그는 <br />과<br />혼용 가능</p>
    <!-- 엔터티 (&lt;, &gt;) -->
    <p>p 태그는 &lt;br /&gt;과<br />혼용 가능</p>
    <p>태그의 경우에는 일반 문장에서 넣으면 요소 취급</p>
  </body>
</html>
